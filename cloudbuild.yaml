steps:
  # Step 1: Build Docker image
  # Note: NEXT_PUBLIC_SUPABASE_URL must be passed at build time for Next.js client-side code
  # NBAI_API_KEY is NOT needed at build time - it's proxied server-side at runtime
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$$SUPABASE_URL'
      - '.'
    secretEnv: ['SUPABASE_URL']
    timeout: 900s # 15 minutes (within free tier 120 min/day)

  # Step 2: Push to Artifact Registry with SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA'

  # Step 3: Push to Artifact Registry with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'
      - '--set-secrets'
      - 'NEXT_PUBLIC_SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,NEXTAUTH_SECRET=nextauth-secret:latest,SEATGEEK_CLIENT_ID=seatgeek-client-id:latest,SEATGEEK_CLIENT_SECRET=seatgeek-client-secret:latest,NBAI_API_KEY=nbai-api-key:latest'

  # Step 5: Run smoke tests
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: /bin/bash
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region ${_REGION} --format 'value(status.url)')
        echo "Testing service at: $SERVICE_URL"
        curl -f -s -o /dev/null -w "HTTP %{http_code}\n" $SERVICE_URL || exit 1
        echo "Smoke test passed!"

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY_REPO: 'mlb-itinerary-images'
  _SERVICE_NAME: 'mlb-itinerary-prod'

# Optimization options
options:
  machineType: 'E2_HIGHCPU_8' # Faster builds (still free tier)
  logging: CLOUD_LOGGING_ONLY

# Store images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest'

# Timeout for entire build
timeout: 1800s # 30 minutes max

# Secret Manager secrets for build-time variables
# Note: NBAI_API_KEY is NOT needed at build time - it's used at runtime via --set-secrets
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/supabase-url/versions/latest
      env: 'SUPABASE_URL'
